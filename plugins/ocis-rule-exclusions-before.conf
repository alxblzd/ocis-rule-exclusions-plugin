# Plugin name: ocis-rule-exclusions
# Plugin description: Rule exclusions for ownCloud Infinite Scale (oCIS)
# Local, unregistered rule ID block: 9,542,000 - 9,542,999
# Plugin version: 0.1.3

# Documentation:
# https://github.com/alxblzd/ocis-rule-exclusions-plugin

# Generic rule to disable the plugin.
SecRule TX:ocis-rule-exclusions-plugin_enabled "@eq 0" \
    "id:9542099,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'ocis-rule-exclusions-plugin/0.1.3',\
    ctl:ruleRemoveById=9542100-9542999"

#
# [ oCIS Web ]
#

# oCIS Web serves its runtime configuration from /config.json. Some reverse
# proxies expose the same resource below /web/config.json. These filenames can
# trigger the restricted-file-access rule.
SecRule REQUEST_FILENAME "@rx ^/(?:web/)?config\.json$" \
    "id:9542100,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'ocis-rule-exclusions-plugin/0.1.3',\
    ctl:ruleRemoveTargetById=930130;REQUEST_FILENAME"

#
# [ Graph API ]
#

# Microsoft Graph-compatible oCIS endpoints use `$filter` and `$orderby` as
# OData parameter names. CRS 4.25 also matches the `$or` prefix of `$orderby`.
# Remove only those argument names from the MongoDB detector.
SecRule REQUEST_FILENAME "@rx ^/graph/(?:v1\.0/users|v1beta1/(?:drives|me/drives))$" \
    "id:9542120,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'ocis-rule-exclusions-plugin/0.1.3',\
    ctl:ruleRemoveTargetById=942290;ARGS_NAMES:$filter,\
    ctl:ruleRemoveTargetById=942290;ARGS_NAMES:$orderby"

# Updating an oCIS user, including changing the user's password, uses PATCH on
# the Microsoft Graph-compatible user resource. Allow that method only for a
# single user resource; the request body remains fully inspected.
SecRule REQUEST_FILENAME "@rx ^/graph/v1\.0/users/[^/]+$" \
    "id:9542121,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'ocis-rule-exclusions-plugin/0.1.3',\
    chain"
    SecRule REQUEST_METHOD "@streq PATCH" \
        "t:none,\
        ctl:ruleRemoveById=911100"

#
# [ WebDAV ]
#

# oCIS uses standards-based WebDAV methods below /dav/. Keep the method-policy
# exclusion limited to DAV paths and known DAV methods.
SecRule REQUEST_FILENAME "@beginsWith /dav/" \
    "id:9542200,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'ocis-rule-exclusions-plugin/0.1.3',\
    chain"
    SecRule REQUEST_METHOD "@rx ^(?:PROPFIND|PROPPATCH|REPORT|MKCOL|MOVE|COPY|LOCK|UNLOCK|PUT|DELETE)$" \
        "t:none,\
        ctl:ruleRemoveById=911100"

# Files stored below /dav/spaces/ may legitimately have extensions restricted
# by the generic CRS policy. Exclude only the request basename from that rule.
SecRule REQUEST_FILENAME "@beginsWith /dav/spaces/" \
    "id:9542201,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'ocis-rule-exclusions-plugin/0.1.3',\
    ctl:ruleRemoveTargetById=920440;REQUEST_BASENAME"

#
# [ TUS and binary uploads ]
#

# oCIS uses the TUS protocol below /data. Permit only the observed TUS write
# methods instead of extending the global CRS method policy.
SecRule REQUEST_FILENAME "@rx ^/data(?:/|$)" \
    "id:9542210,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'ocis-rule-exclusions-plugin/0.1.3',\
    chain"
    SecRule REQUEST_METHOD "@rx ^(?:PUT|PATCH)$" \
        "t:none,\
        ctl:ruleRemoveById=911100"

# Creating a TUS upload can send an opaque body to PUT /data without a
# Content-Type header. Do not pass that binary body through a form parser, and
# suppress only the two missing-header checks for this exact method and path.
SecRule REQUEST_FILENAME "@streq /data" \
    "id:9542211,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'ocis-rule-exclusions-plugin/0.1.3',\
    chain"
    SecRule REQUEST_METHOD "@streq PUT" \
        "t:none,\
        ctl:requestBodyAccess=Off,\
        ctl:ruleRemoveById=920340,\
        ctl:ruleRemoveById=920640"

# TUS chunks and oCIS binary uploads use application/offset+octet-stream.
# CRS cannot meaningfully inspect arbitrary file bytes as application
# arguments, so disable body inspection only for the exact upload endpoints
# carrying this exact media type. DAV uploads may target a folder below the
# space root. Request headers and the URI remain inspected.
SecRule REQUEST_FILENAME "@rx ^/(?:data/[^/]+|dav/spaces/[^/]+(?:/.*)?)$" \
    "id:9542212,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'ocis-rule-exclusions-plugin/0.1.3',\
    chain"
    SecRule REQUEST_HEADERS:Content-Type "@streq application/offset+octet-stream" \
        "t:none,\
        ctl:requestBodyAccess=Off,\
        ctl:ruleRemoveById=920420"
