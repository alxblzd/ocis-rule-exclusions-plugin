# Generic rule to disable the plugin
#
# CRS plugins are enabled when placed in the plugin directory. To disable this
# plugin, uncomment the rule below. The variable can also be set before this
# file is loaded, for example when enabling plugins conditionally per host.
#
# SecRule &TX:ocis-rule-exclusions-plugin_enabled "@eq 0" \
#     "id:9542010,\
#     phase:1,\
#     pass,\
#     t:none,\
#     nolog,\
#     ver:'ocis-rule-exclusions-plugin/0.1.3',\
#     setvar:'tx.ocis-rule-exclusions-plugin_enabled=0'"
