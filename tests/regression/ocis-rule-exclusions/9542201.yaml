---
meta:
  author: "alxblzd"
  description: "User-controlled file extensions in oCIS spaces"
rule_id: 9542201
tests:
  - test_id: 1
    desc: Allow a restricted extension below the spaces DAV endpoint
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
          port: 80
          method: GET
          uri: /dav/spaces/space-id/driver.dll
        output:
          log:
            no_expect_ids: [920440, 949110]
  - test_id: 2
    desc: Keep the restricted-extension policy outside the spaces endpoint
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
          port: 80
          method: GET
          uri: /downloads/driver.dll
        output:
          log:
            expect_ids: [920440]
