---
meta:
  author: alxblzd
  description: oCIS plain text DAV uploads
rule_id: 9542204
tests:
- test_id: 1
  desc: Allow plain text DAV upload
  stages:
  - input:
      dest_addr: 127.0.0.1
      headers:
        Host: localhost
        User-Agent: OWASP CRS
        Content-Type: text/plain
      port: 80
      method: PUT
      uri: /dav/spaces/space-id/file.txt
      data: ordinary text file
    output:
      log:
        no_expect_ids:
        - 920420
        - 949110
- test_id: 2
  desc: Keep type policy outside DAV
  stages:
  - input:
      dest_addr: 127.0.0.1
      headers:
        Host: localhost
        User-Agent: OWASP CRS
        Content-Type: text/plain
      port: 80
      method: PUT
      uri: /other/file.txt
      data: ordinary text file
    output:
      log:
        expect_ids:
        - 920420
- test_id: 3
  desc: Keep type policy for other DAV methods
  stages:
  - input:
      dest_addr: 127.0.0.1
      headers:
        Host: localhost
        User-Agent: OWASP CRS
        Content-Type: text/plain
      port: 80
      method: POST
      uri: /dav/spaces/space-id/file.txt
      data: ordinary text file
    output:
      log:
        expect_ids:
        - 920420
