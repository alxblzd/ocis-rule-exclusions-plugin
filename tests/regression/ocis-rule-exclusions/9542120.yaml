---
meta:
  author: "alxblzd"
  description: "OData filter parameter on oCIS Graph endpoints"
rule_id: 9542120
tests:
  - test_id: 1
    desc: Allow $filter when listing users
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
          port: 80
          method: GET
          uri: /graph/v1.0/users?%24filter=&%24orderby=displayName
        output:
          log:
            no_expect_ids: [942290]
  - test_id: 2
    desc: Allow $filter when listing project spaces
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
          port: 80
          method: GET
          uri: /graph/v1beta1/drives?%24filter=driveType%20eq%20project
        output:
          log:
            no_expect_ids: [942290]
  - test_id: 3
    desc: Allow $filter when listing the current user's spaces
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
          port: 80
          method: GET
          uri: /graph/v1beta1/me/drives?%24filter=driveType%20eq%20project
        output:
          log:
            no_expect_ids: [942290]
