---
meta:
  author: "alxblzd"
  description: "oCIS Web runtime configuration paths"
rule_id: 9542100
tests:
  - test_id: 1
    desc: Allow the root runtime configuration file
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
          port: 80
          method: GET
          uri: /config.json
        output:
          log:
            no_expect_ids: [930130]
  - test_id: 2
    desc: Allow the runtime configuration file below the web prefix
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
          port: 80
          method: GET
          uri: /web/config.json
        output:
          log:
            no_expect_ids: [930130]
