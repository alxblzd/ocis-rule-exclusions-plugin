---
name: Personal repository integration tests
on: [push, pull_request] # yamllint disable-line rule:truthy
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  modsecurity:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        backend: [apache, nginx]
        crs: [v4.25.1, main]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: coreruleset/coreruleset
          ref: ${{ matrix.crs }}
          path: crs
          persist-credentials: false
      - name: Install FTW
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download -R coreruleset/go-ftw v2.4.0 -p 'ftw_*_linux_amd64.tar.gz' -O - | tar -xzf - ftw
      - name: Start WAF
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          mkdir -p "tests/logs/$BACKEND"
          chmod a+rw "tests/logs/$BACKEND"
          git -C crs rev-parse HEAD | tee tests/crs-revision.txt
          docker compose -f tests/integration/docker-compose.yml up -d "$BACKEND"
          curl --retry 10 --retry-all-errors --retry-delay 2 --retry-max-time 60 --max-time 5 http://localhost/ -o /dev/null
      - name: Run plugin tests
        env:
          FTW_LOGFILE: tests/logs/${{ matrix.backend }}/error.log
        run: |
          ./ftw check -d tests/regression
          ./ftw run -d tests/regression --report-triggered-rules --store-failure-waf-logs 2>&1 | tee tests/results.log
      - name: Capture container logs
        if: always()
        run: docker compose -f tests/integration/docker-compose.yml logs --no-color > tests/containers.log 2>&1
      - name: Report test diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('tests/results.log')
          if p.exists():
              report = p.read_text()
              print('::notice::' + report.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          detections = set()
          for log in Path('tests/logs').glob('*/error.log'):
              for line in log.read_text(errors='replace').splitlines():
                  rule = re.search(r'\[id "(\d+)"\]', line)
                  message = re.search(r'\[msg "([^\"]*)"\]', line)
                  if rule and message:
                      detections.add((int(rule[1]), message[1]))
          if detections:
              report = '\n'.join(f'{rule}: {message}' for rule, message in sorted(detections))
              print('::notice::' + report.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
      - name: Preserve test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: modsecurity-${{ matrix.backend }}-${{ matrix.crs }}
          path: |
            tests/logs/
            tests/results.log
            tests/containers.log
            tests/crs-revision.txt
          retention-days: 7
      - name: Stop test containers
        if: always()
        run: docker compose -f tests/integration/docker-compose.yml down --volumes

  coraza:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: coreruleset/coreruleset
          ref: v4.29.0
          path: crs
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.7'
          cache-dependency-path: tests/coraza/go.sum
      - name: Test Coraza PL1 and disabled-plugin controls
        working-directory: tests/coraza
        env:
          CRS_DIR: ${{ github.workspace }}/crs
        run: go test -count=1 -mod=readonly -v ./... 2>&1 | tee results.log
      - name: Preserve Coraza results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coraza-pl1-v4.29.0
          path: tests/coraza/results.log
          retention-days: 7
