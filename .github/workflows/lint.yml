---
# Personal repository CI only. No secrets are passed to the reusable workflow,
# and the job has read-only access to this repository.
on: [push, pull_request] # yamllint disable-line rule:truthy
name: Personal repository plugin lint

permissions:
  contents: read

jobs:
  plugin-lint:
    uses: coreruleset/crs-plugin-test-action/.github/workflows/lint.yaml@7e1ee6d07105ae3cb6eec95e45acb5e1a895e3d4 # v3.0.0
